workflows:
  ios-verification:
    name: Verifica iOS Tornei Old School
    instance_type: mac_mini_m2
    working_directory: mobile
    max_build_duration: 60
    environment:
      flutter: 3.47.7
      xcode: latest
    scripts:
      - name: Dipendenze
        script: flutter pub get
      - name: Analisi
        script: flutter analyze
      - name: Test
        script: flutter test
      - name: Compilazione iOS senza firma
        script: flutter build ios --release --no-codesign
    artifacts:
      - mobile/build/ios/iphoneos/*.app
